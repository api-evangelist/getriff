aid: getriff
name: getriff
description: Riff (getriff.co) is a voice and video workspace for remote and hybrid
  teams, backed by Balderton Capital. Its Mac and Windows desktop apps aim to reduce
  Slack overload and Zoom fatigue with a minimal video header, one-click availability-based
  chat, multi-screen sharing with drawing tools, advanced echo cancellation, and focus-time
  scheduling that updates status automatically, plus Google Calendar and Slack integrations.
  Riff ships as a consumer/team desktop product and publishes no public API, developer
  portal, SDKs, or OpenAPI; this API Evangelist profile captures its identity, legal, and
  domain-security surface. Surfaced as a portfolio company of balderton-capital.
